<script>
  // ESTADO GLOBAL DE LA APP
  let currentUser = null;
  let currentOficios = [];
  let selectedOficioId = null;

  // --- NAVEGACIÓN Y UX ---
  function mostrarVista(vistaId) {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById(vistaId).classList.remove('hidden');
  }

  // --- LOGIN ---
  function intentarLogin() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const btnText = document.getElementById('loginBtnText');
    const loader = document.getElementById('loginLoader');
    const errorMsg = document.getElementById('loginError');

    if(!user || !pass) return;

    // UX: Estado de carga
    btnText.textContent = "Verificando...";
    loader.classList.remove('hidden');
    errorMsg.classList.add('hidden');

    google.script.run
      .withSuccessHandler(function(response) {
        btnText.textContent = "Entrar";
        loader.classList.add('hidden');

        if(response.success) {
          currentUser = response.user;
          document.getElementById('userNameDisplay').textContent = "Hola, " + currentUser.nombre;
          mostrarVista('dashboardView');
          cargarOficios('mis'); // Por defecto carga los suyos
        } else {
          errorMsg.textContent = response.message;
          errorMsg.classList.remove('hidden');
        }
      })
      .loginUser(user, pass);
  }

  function cerrarSesion() {
    currentUser = null;
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    mostrarVista('loginView');
  }

  // --- CARGA DE DATOS ---
  function cargarOficios(filtro) {
    const tbody = document.getElementById('tablaOficiosBody');
    const loader = document.getElementById('tablaLoader');
    
    tbody.innerHTML = '';
    loader.classList.remove('hidden');

    google.script.run
      .withSuccessHandler(function(oficios) {
        loader.classList.add('hidden');
        currentOficios = oficios;
        renderizarTabla(filtro);
      })
      .getOficios();
  }

  function renderizarTabla(filtro) {
    const tbody = document.getElementById('tablaOficiosBody');
    tbody.innerHTML = '';

    currentOficios.forEach(oficio => {
      // Lógica del filtro
      const esMiCarpeta = currentUser.carpetas.includes(oficio.carpeta.toString());
      if(filtro === 'mis' && !esMiCarpeta && !currentUser.carpetas.includes('Libre')) return;

      const badgeColor = oficio.estado === 'Donado' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';

      const tr = document.createElement('tr');
      tr.className = 'hover:bg-slate-50 transition-colors group';
      tr.innerHTML = `
        <td class="p-4 font-medium text-slate-800">${oficio.negocio}</td>
        <td class="p-4 text-slate-500">Carpeta ${oficio.carpeta}</td>
        <td class="p-4">
          <span class="px-2 py-1 rounded-full text-xs font-medium ${badgeColor}">${oficio.estado || 'Pendiente'}</span>
        </td>
        <td class="p-4 text-right">
          <button onclick="abrirModalOficio('${oficio.id}')" class="text-indigo-600 hover:text-indigo-800 font-medium text-sm opacity-0 group-hover:opacity-100 transition-opacity">Ver / Actualizar</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- MODAL Y SEGUIMIENTO ---
  function abrirModalOficio(idOficio) {
    selectedOficioId = idOficio;
    const oficio = currentOficios.find(o => o.id == idOficio);
    
    document.getElementById('modalOficioName').textContent = oficio.negocio;
    document.getElementById('modalOficioCarpeta').textContent = 'Carpeta ' + oficio.carpeta;
    document.getElementById('nuevoComentario').value = '';
    document.getElementById('modalOficio').classList.remove('hidden');
    
    cargarHistorial(idOficio);
  }

  function cerrarModal() {
    document.getElementById('modalOficio').classList.add('hidden');
    selectedOficioId = null;
  }

  function cargarHistorial(idOficio) {
    const timeline = document.getElementById('historialTimeline');
    timeline.innerHTML = '<div class="text-center text-slate-400 text-sm py-4"><div class="loader inline-block"></div></div>';

    google.script.run
      .withSuccessHandler(function(historial) {
        if(historial.length === 0) {
          timeline.innerHTML = '<p class="text-sm text-slate-500 italic">No hay seguimientos registrados aún.</p>';
          return;
        }

        timeline.innerHTML = historial.map(h => `
          <div class="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex flex-col gap-1">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-700">${h.usuario}</span>
              <span class="text-[10px] text-slate-400">${h.fecha}</span>
            </div>
            <p class="text-sm text-slate-600 mt-1">${h.comentario}</p>
            ${h.tipo === 'Donación' ? '<span class="text-xs text-green-600 font-medium mt-1">🎉 Donación Registrada</span>' : ''}
          </div>
        `).join('');
      })
      .getDetalleOficio(idOficio);
  }

  function guardarAccion(esDonacion) {
    const comentario = document.getElementById('nuevoComentario').value;
    if(!comentario.trim()) {
      alert("Por favor escribe un comentario sobre el avance.");
      return;
    }

    google.script.run
      .withSuccessHandler(function() {
        // Recargar vistas para reflejar cambios
        cargarHistorial(selectedOficioId);
        cargarOficios('mis'); // Actualiza el estado en la tabla de fondo
        document.getElementById('nuevoComentario').value = '';
        if(esDonacion) cerrarModal(); // Si ya donó, cerramos la vista
      })
      .registrarSeguimiento(selectedOficioId, currentUser.id, comentario, esDonacion);
  }
</script>
